<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>ZOOZ Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2744 0%, #1a3a5c 50%, #0d5c8a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            text-align: center;
            color: white;
        }

        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .header h1 span { color: #4fc3f7; }
        .header p { font-size: 13px; opacity: 0.75; margin-top: 4px; }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .chat-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .messages {
            background: rgba(255,255,255,0.97);
            border-radius: 16px;
            padding: 22px;
            min-height: 420px;
            max-height: 520px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        .welcome {
            text-align: center;
            color: #888;
            padding: 22px 0 10px;
        }

        .welcome .avatar {
            min-height: 64px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome .avatar img {
            display: block;
            max-width: 150px;
            max-height: 62px;
            object-fit: contain;
        }

        .logo-fallback {
            display: none;
            color: #163b5b;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .welcome p { font-size: 15px; line-height: 1.7; color: #555; }

        .user-msg {
            background: linear-gradient(135deg, #1a3a5c, #0d5c8a);
            color: white;
            padding: 11px 16px;
            border-radius: 18px 18px 4px 18px;
            margin: 8px 0;
            max-width: 72%;
            float: right;
            clear: both;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(26,58,92,0.3);
        }

        .bot-msg {
            background: #f5f7fa;
            color: #2c3e50;
            padding: 14px 16px;
            border-radius: 18px 18px 18px 4px;
            margin: 8px 0;
            max-width: 86%;
            float: left;
            clear: both;
            line-height: 1.75;
            font-size: 14px;
            border-right: 3px solid #4fc3f7;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .bot-msg strong { font-weight: 700; color: #183b59; }

        .sources {
            font-size: 12px;
            color: #999;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .sources-label { color: #999; margin-left: 2px; }

        .sources a {
            display: inline-block;
            color: #0277bd;
            background: #eaf6fc;
            border: 1px solid #cbeafa;
            padding: 3px 8px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .sources a:hover { background: #d8f1fc; text-decoration: none; }
        .clearfix { clear: both; }

        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }

        .suggestion-btn {
            background: rgba(255,255,255,0.12);
            border: 1.5px solid rgba(255,255,255,0.4);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background: rgba(255,255,255,0.25);
            border-color: white;
            transform: translateY(-1px);
        }

        .input-row { display: flex; gap: 10px; align-items: center; }

        .input-row input {
            flex: 1;
            min-width: 0;
            padding: 13px 18px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            background: rgba(255,255,255,0.95);
            color: #2c3e50;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .input-row input::placeholder { color: #aaa; }

        .mic-btn {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 50%;
            background: rgba(255,255,255,0.14);
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            transition: all 0.2s;
        }

        .mic-btn:hover { background: rgba(255,255,255,0.24); transform: translateY(-1px); }
        .mic-btn.listening { background: #d94a4a; border-color: #ffb5b5; animation: micPulse 1.2s infinite; }
        .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(217,74,74,0.45); }
            50% { box-shadow: 0 0 0 8px rgba(217,74,74,0); }
        }

        .send-btn {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover { transform: translateY(-1px); }

        .contact-bar {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 10px 16px;
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .contact-bar:hover { background: rgba(255,255,255,0.18); color: white; }

        .loading-dots span {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #aaa;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        @media (max-width: 560px) {
            .chat-wrapper { padding: 12px 8px; }
            .messages { padding: 14px; min-height: 430px; max-height: 58vh; }
            .user-msg { max-width: 84%; }
            .bot-msg { max-width: 92%; }
            .suggestion-btn { font-size: 12px; padding: 7px 12px; }
            .input-row { gap: 7px; }
            .send-btn { padding: 12px 17px; }
            .mic-btn { width: 44px; height: 44px; flex-basis: 44px; }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>
            ZOOZ <span>Assistant</span>
            <span class="online-dot"></span>
        </h1>
        <p>העוזר הווירטואלי של ZOOZ — שאל אותי הכל!</p>
    </div>

    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="welcome">
                    <div class="avatar">
                        <img
                            src="https://www.zooz.co.il/images/logo.png"
                            alt="לוגו ZOOZ"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                        <span class="logo-fallback">ZOOZ</span>
                    </div>
                    <p>
                        שלום! אני העוזר הווירטואלי של ZOOZ.<br>
                        איך אוכל לעזור לך היום?
                    </p>
                </div>
            </div>

            <div class="suggestions">
                <button class="suggestion-btn" onclick="askQuestion('מה השירותים של ZOOZ?')">מה השירותים של ZOOZ?</button>
                <button class="suggestion-btn" onclick="askQuestion('מה זה חדשנות שיטתית?')">מה זה חדשנות שיטתית?</button>
                <button class="suggestion-btn" onclick="askQuestion('איך ליצור קשר?')">איך ליצור קשר?</button>
                <button class="suggestion-btn" onclick="askQuestion('מה ZOOZ יכולה לעשות עבורי?')">מה ZOOZ יכולה לעשות עבורי?</button>
            </div>

            <div class="input-row">
                <input
                    type="text"
                    id="question"
                    placeholder="כתוב את שאלתך כאן..."
                    aria-label="שאלה ל-ZOOZ Assistant"
                    onkeypress="if(event.key==='Enter') sendQuestion()">

                <button
                    class="mic-btn"
                    id="micBtn"
                    type="button"
                    onclick="toggleDictation()"
                    aria-label="הכתבה קולית"
                    title="הכתבה קולית">
                    🎤
                </button>

                <button class="send-btn" onclick="sendQuestion()">שלח ➤</button>
            </div>

            <a href="mailto:info@zooz.co.il" class="contact-bar">
                📧 צור קשר עם ZOOZ — info@zooz.co.il
            </a>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatAnswer(answer) {
            let formatted = escapeHtml(answer);
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function isFallbackAnswer(answer) {
            const text = String(answer || '').trim();
            const fallbackPatterns = [
                'אין לי מידע מדויק',
                'אין לי מידע במקורות',
                'אין לי במקורות',
                'אין לי מידע במקורות של ZOOZ',
                'אני יכול לעזור רק בנושאים הקשורים ל-ZOOZ',
                'לא אמציא תשובה',
                'אירעה שגיאה טכנית',
                'אירעה שגיאה זמנית',
                'השירות עמוס זמנית'
            ];
            return fallbackPatterns.some(pattern => text.includes(pattern));
        }

        function createSourcesHtml(sources, answer) {
            if (isFallbackAnswer(answer) || !Array.isArray(sources) || sources.length === 0) {
                return '';
            }

            const uniqueSources = [...new Set(sources.filter(Boolean))];
            const links = uniqueSources
                .map((url, index) => {
                    try {
                        const parsedUrl = new URL(url);
                        if (parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:') {
                            return '';
                        }
                        const safeUrl = escapeHtml(url);
                        return `
                            <a href="${safeUrl}" target="_blank" rel="noopener noreferrer" title="${safeUrl}">
                                מקור ${index + 1}
                            </a>
                        `;
                    } catch (error) {
                        return '';
                    }
                })
                .filter(Boolean)
                .join('');

            if (!links) return '';

            return `
                <div class="sources">
                    <span class="sources-label">מקורות:</span>
                    ${links}
                </div>
            `;
        }

        function askQuestion(q) {
            document.getElementById('question').value = q;
            sendQuestion();
        }

        let recognition = null;
        let isListening = false;

        function setMicState(listening) {
            isListening = listening;
            const micBtn = document.getElementById('micBtn');
            if (!micBtn) return;
            micBtn.classList.toggle('listening', listening);
            micBtn.textContent = listening ? '⏹' : '🎤';
            micBtn.title = listening ? 'עצור הכתבה' : 'הכתבה קולית';
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('micBtn');

            if (!SpeechRecognition) {
                if (micBtn) {
                    micBtn.disabled = true;
                    micBtn.title = 'הכתבה קולית אינה נתמכת בדפדפן זה';
                }
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => setMicState(true);

            recognition.onresult = event => {
                const transcript = event.results?.[0]?.[0]?.transcript || '';
                const input = document.getElementById('question');
                if (transcript && input) {
                    input.value = transcript.trim();
                    input.focus();
                }
            };

            recognition.onerror = event => {
                console.warn('Speech recognition error:', event.error);
                setMicState(false);
            };

            recognition.onend = () => setMicState(false);
        }

        function toggleDictation() {
            if (!recognition) return;
            try {
                if (isListening) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            } catch (error) {
                console.warn('Could not toggle speech recognition:', error);
                setMicState(false);
            }
        }

        function sendQuestion() {
            const input = document.getElementById('question');
            const q = input.value.trim();
            if (!q) return;

            if (isListening && recognition) {
                try { recognition.stop(); } catch (error) { console.warn(error); }
            }

            const messages = document.getElementById('messages');
            const loadingId = `loading-${Date.now()}-${Math.random().toString(16).slice(2)}`;

            messages.innerHTML += `
                <div class="user-msg">${escapeHtml(q)}</div>
                <div class="clearfix"></div>
                <div class="bot-msg" id="${loadingId}">
                    <div class="loading-dots"><span></span><span></span><span></span></div>
                </div>
                <div class="clearfix"></div>
            `;

            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.json();
            })
            .then(data => {
                const loading = document.getElementById(loadingId);
                if (loading) loading.remove();

                if (data.error) {
                    messages.innerHTML += `
                        <div class="bot-msg">אירעה שגיאה זמנית, נסה שוב בעוד רגע.</div>
                        <div class="clearfix"></div>
                    `;
                    messages.scrollTop = messages.scrollHeight;
                    return;
                }

                const answer = data.answer || 'לא התקבלה תשובה.';
                const formattedAnswer = formatAnswer(answer);
                const sourcesHtml = createSourcesHtml(data.sources, answer);

                messages.innerHTML += `
                    <div class="bot-msg">
                        ${formattedAnswer}
                        ${sourcesHtml}
                    </div>
                    <div class="clearfix"></div>
                `;
                messages.scrollTop = messages.scrollHeight;
            })
            .catch(error => {
                console.error('Chat request failed:', error);
                const loading = document.getElementById(loadingId);
                const errorHtml = '<div class="bot-msg">אירעה שגיאה זמנית, נסה שוב בעוד רגע.</div>';

                if (loading) {
                    loading.outerHTML = errorHtml;
                } else {
                    messages.innerHTML += `${errorHtml}<div class="clearfix"></div>`;
                }
                messages.scrollTop = messages.scrollHeight;
            });
        }

        document.addEventListener('DOMContentLoaded', initSpeechRecognition);
    </script>
</body>
</html>
